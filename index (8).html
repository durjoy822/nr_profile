<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nayem | Our Town</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f8fd;
      --ink: #1f2a44;
      --mut: #6b7794;
      --line: #e6ebf5;
      --brand: #4f7cff;
      --green: #43b98a;
      --shadow: 0 10px 30px -12px rgba(40, 60, 110, .25);
      --ac: #4f7cff;
      --dk: #3d5bd0;
      --soft: #eef3ff
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #e3f4e0;
      color: var(--ink);
      font-size: .95rem
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-weight: 600;
      color: var(--ink)
    }

    .mut {
      color: var(--mut)
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh
    }

    #stage {
      flex: 1;
      min-height: 0;
      position: relative;
      background: #e3f4e0;
      overflow: hidden
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none
    }

    .brandchip {
      position: absolute;
      left: 16px;
      top: 14px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, .92);
      border-radius: 99px;
      padding: 6px 16px 6px 6px;
      font-weight: 600;
      box-shadow: var(--shadow)
    }

    .brandchip i {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f7cff, #8fb0ff);
      display: grid;
      place-items: center;
      color: #fff;
      font-style: normal;
      font-size: .78rem
    }

    /* Footer dock */
    .foot {
      flex: none;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px));
      background: #e3f4e0;
      border-top: 0;
      box-shadow: none
    }

    .call {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 0;
      border-radius: 99px;
      padding: 7px 28px 7px 7px;
      background: linear-gradient(135deg, #ffb86b, #ff7a45);
      color: #fff;
      text-align: left;
      box-shadow: 0 12px 24px -10px rgba(255, 122, 69, .85);
      transition: transform .2s, box-shadow .2s;
      animation: pulse 2.4s infinite
    }

    .call:hover {
      transform: translateY(-2px) scale(1.03)
    }

    .call:active {
      transform: scale(.98)
    }

    .call .av {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #fff;
      display: grid;
      place-items: center;
      font-size: 1.55rem;
      animation: wiggle 3s infinite;
      flex: none
    }

    .call b {
      display: block;
      font-size: 1rem;
      line-height: 1.15
    }

    .call small {
      display: block;
      font-weight: 500;
      opacity: .92;
      font-size: .74rem;
      line-height: 1.2
    }

    .call[disabled] {
      filter: grayscale(.7);
      opacity: .55;
      animation: none;
      pointer-events: none
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 12px 24px -10px rgba(255, 122, 69, .85), 0 0 0 0 rgba(255, 138, 61, .45)
      }

      70% {
        box-shadow: 0 12px 24px -10px rgba(255, 122, 69, .85), 0 0 0 14px rgba(255, 138, 61, 0)
      }

      100% {
        box-shadow: 0 12px 24px -10px rgba(255, 122, 69, .85), 0 0 0 0 rgba(255, 138, 61, 0)
      }
    }

    @keyframes wiggle {

      0%,
      86%,
      100% {
        transform: rotate(0)
      }

      90% {
        transform: rotate(-12deg)
      }

      94% {
        transform: rotate(10deg)
      }
    }

    .stay {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 99px;
      padding: 11px 20px;
      font-weight: 600;
      color: var(--mut);
      display: none
    }

    .stay.on {
      display: block;
      animation: fadeUp .4s both
    }

    .stay:hover {
      color: var(--ink);
      border-color: #c9d3ea
    }

    .prog {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      gap: 6px
    }

    .prog span {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .7);
      background: rgba(255, 255, 255, .55);
      font-size: 1rem;
      filter: grayscale(1) opacity(.5);
      transition: .4s
    }

    .prog span.on {
      filter: none;
      border-color: var(--green);
      background: #fff;
      transform: scale(1.05)
    }

    @media(max-width:980px) {
      .prog {
        display: none
      }
    }

    .dpad {
      display: none;
      position: fixed;
      left: 12px;
      bottom: calc(96px + env(safe-area-inset-bottom, 0px));
      z-index: 5;
      grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(2, 48px);
      gap: 5px
    }

    .dpad button {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .92);
      border-radius: 14px;
      color: var(--brand);
      touch-action: none;
      box-shadow: var(--shadow)
    }

    .dpad button:active {
      background: var(--brand);
      color: #fff
    }

    @media(pointer:coarse) {
      .dpad {
        display: grid
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    /* Modal */
    .modal.fade .modal-dialog {
      transform: translateY(46px) scale(.92);
      opacity: 0;
      transition: transform .5s cubic-bezier(.2, 1.15, .3, 1), opacity .3s
    }

    .modal.show .modal-dialog {
      transform: none;
      opacity: 1
    }

    .modal-backdrop.show {
      opacity: .3;
      backdrop-filter: blur(3px)
    }

    .modal-content {
      border: 0;
      border-radius: 24px;
      overflow: hidden;
      background: #f3faf0;
      box-shadow: 0 30px 80px -20px rgba(31, 42, 68, .5);
      --dkx: color-mix(in srgb, var(--dk) 68%, #1f2a44);
      --btn: color-mix(in srgb, var(--dk) 76%, #1f2a44);
      --line2: color-mix(in srgb, var(--ac) 24%, #ffffff)
    }

    .ph {
      padding: 22px 24px 18px;
      display: flex;
      gap: 16px;
      align-items: center;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--line2)
    }

    .ph>* {
      position: relative;
      z-index: 1
    }

    .ph::after {
      content: "";
      position: absolute;
      right: -30px;
      top: -50px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .5);
      animation: floaty 6s ease-in-out infinite
    }

    .ph::before {
      content: "";
      position: absolute;
      right: 90px;
      bottom: -40px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--ac) 18%, transparent);
      animation: floaty 7s 1s ease-in-out infinite reverse
    }

    @keyframes floaty {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(14px)
      }
    }

    @keyframes bob {

      0%,
      100% {
        transform: translateY(0) rotate(0)
      }

      50% {
        transform: translateY(-4px) rotate(-4deg)
      }
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-14px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(.7)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .pe {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: #fff;
      display: grid;
      place-items: center;
      font-size: 1.9rem;
      box-shadow: var(--shadow);
      flex: none;
      animation: pop .6s .2s both cubic-bezier(.2, 1.6, .4, 1), bob 3.2s 1s ease-in-out infinite;
      border: 2px solid var(--line2)
    }

    @keyframes pop {
      from {
        transform: scale(0) rotate(-20deg)
      }

      to {
        transform: none
      }
    }

    .ph h5 {
      margin: 0;
      font-size: 1.2rem
    }

    .pq {
      margin: 2px 0 0;
      color: var(--mut);
      font-size: .88rem
    }

    .sc {
      background: #fff;
      border: 1px solid var(--line2, var(--line));
      border-top: 3px solid var(--ac);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 6px 16px -12px rgba(31, 42, 68, .25);
      animation: fadeUp .55s cubic-bezier(.2, .8, .2, 1) both;
      overflow-wrap: anywhere
    }

    .sc h6 {
      font-size: .95rem;
      margin-bottom: 12px
    }

    .chip {
      display: inline-block;
      background: var(--soft);
      color: var(--dkx, #3d5bd0);
      animation: popIn .4s both;
      border-radius: 99px;
      padding: 2px 12px;
      font-size: .82rem;
      margin: 0 6px 6px 0;
      text-decoration: none;
      font-weight: 500
    }

    .track {
      height: 9px;
      background: #edf1f9;
      border-radius: 99px;
      overflow: hidden
    }

    .track i {
      display: block;
      height: 100%;
      width: 0;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--ac), color-mix(in srgb, var(--ac) 50%, #ffffff));
      transition: width 1.1s ease
    }

    .sk {
      margin-bottom: 12px;
      font-size: .88rem
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px
    }

    .facts div {
      background: var(--soft);
      animation: popIn .45s .35s both;
      border-radius: 14px;
      padding: 10px;
      text-align: center
    }

    .facts b {
      display: block;
      font-size: 1.05rem;
      color: var(--dkx, var(--brand))
    }

    .facts span {
      font-size: .78rem;
      color: var(--mut)
    }

    .avl {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      margin: 0 auto;
      background: linear-gradient(135deg, #ffd9bd, #ffc6d6);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 1.6rem;
      color: #b25c3f
    }

    .tl {
      position: relative;
      padding-left: 22px
    }

    .tl::before {
      content: "";
      position: absolute;
      left: 5px;
      top: 6px;
      bottom: 6px;
      width: 2px;
      background: color-mix(in srgb, var(--ac) 35%, #ffffff)
    }

    .ti {
      position: relative;
      margin-bottom: 16px;
      animation: slideIn .5s both
    }

    .ti:nth-child(1) {
      animation-delay: .35s
    }

    .ti:nth-child(2) {
      animation-delay: .5s
    }

    .ti:nth-child(3) {
      animation-delay: .65s
    }

    .ti::before {
      content: "";
      position: absolute;
      left: -22px;
      top: 6px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--ac)
    }

    .ti .dt {
      font-size: .8rem;
      color: var(--dkx, #e4764f);
      font-weight: 600
    }

    .ti h6 {
      margin: 2px 0;
      font-size: .98rem
    }

    .ti ul {
      margin: 6px 0 0;
      padding-left: 18px;
      color: var(--mut);
      font-size: .88rem
    }

    .pj {
      display: flex;
      gap: 12px;
      height: 100%
    }

    .pj .ic {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 1.4rem;
      flex: none
    }

    .btn-soft {
      background: var(--btn, var(--brand));
      color: #fff;
      border: 0;
      border-radius: 99px;
      padding: 8px 20px;
      font-weight: 600;
      box-shadow: 0 8px 18px -8px var(--btn, rgba(79, 124, 255, .8));
      transition: transform .2s, filter .2s
    }

    .btn-soft:hover {
      background: var(--btn, #3d6af0);
      filter: brightness(1.12);
      transform: translateY(-2px);
      color: #fff
    }

    .form-control {
      border: 1px solid var(--line2, var(--line));
      border-radius: 12px;
      background: #fbfdfa
    }

    .form-control:focus {
      border-color: var(--ac);
      box-shadow: 0 0 0 .2rem color-mix(in srgb, var(--ac) 25%, transparent)
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #ffb86b;
      outline-offset: 2px
    }

    /* ---------- Responsive: small devices ---------- */
    @media(max-width:575.98px) {
      .modal-dialog {
        --bs-modal-margin: .6rem
      }

      .modal-content {
        border-radius: 20px
      }

      .ph {
        padding: 16px 16px 12px;
        gap: 12px
      }

      .pe {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        font-size: 1.5rem
      }

      .ph h5 {
        font-size: 1.05rem
      }

      .pq {
        font-size: .78rem;
        line-height: 1.35
      }

      .modal-body {
        padding: .4rem 14px 1rem
      }

      .sc {
        padding: 14px;
        border-radius: 16px
      }

      .sc h6 {
        margin-bottom: 10px
      }

      .facts {
        gap: 8px
      }

      .facts div {
        padding: 8px 4px
      }

      .facts b {
        font-size: .92rem
      }

      .facts span {
        font-size: .68rem
      }

      .avl {
        width: 70px;
        height: 70px;
        font-size: 1.3rem
      }

      .pj .ic {
        width: 40px;
        height: 40px;
        font-size: 1.2rem
      }

      .ti h6 {
        font-size: .92rem
      }

      .ti ul,
      .sk {
        font-size: .82rem
      }

      .modal-footer {
        padding: .3rem 14px .9rem
      }

      .modal-footer .btn-soft {
        width: 100%;
        margin: 0
      }

      .brandchip {
        left: 10px;
        top: 10px;
        font-size: .88rem
      }
    }

    @media(max-width:480px) {
      .foot {
        gap: 8px;
        padding-left: 10px;
        padding-right: 10px
      }

      .call {
        gap: 9px;
        padding: 6px 18px 6px 6px;
        min-width: 0
      }

      .call .av {
        width: 38px;
        height: 38px;
        font-size: 1.25rem
      }

      .call b {
        font-size: .9rem
      }

      .call small {
        font-size: .68rem
      }

      .stay {
        padding: 8px 14px;
        font-size: .82rem;
        line-height: 1.2;
        min-width: 0
      }
    }

    @media(max-height:480px) and (orientation:landscape) {
      .ph {
        padding: 10px 16px 8px
      }

      .pe {
        width: 40px;
        height: 40px;
        font-size: 1.3rem
      }

      .foot {
        padding-top: 6px;
        padding-bottom: 6px
      }

      .call .av {
        width: 36px;
        height: 36px
      }

      .modal-footer {
        padding: .2rem 14px .5rem
      }
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div id="stage">
      <canvas id="g" aria-label="Interactive portfolio town map"></canvas>
      <div class="brandchip"><i>NR</i>Nayem</div>
    </div>
    <footer class="foot">
      <div class="prog" id="prog"></div>
      <button class="call" id="callBtn"><span class="av">&#128119;</span><span><b>Call guide</b><small>Sam walks to
            you</small></span></button>
      <button class="stay" id="stayBtn">I’ll explore myself</button>
    </footer>
  </div>
  <div class="dpad" id="dp"><span></span><button data-k="up" aria-label="Up">&#9650;</button><span></span><button
      data-k="left" aria-label="Left">&#9664;</button><button data-k="down" aria-label="Down">&#9660;</button><button
      data-k="right" aria-label="Right">&#9654;</button></div>

  <div class="modal fade" id="pm" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
      <div class="modal-content">
        <div class="ph" id="pH">
          <div class="pe" id="pE"></div>
          <div class="flex-grow-1">
            <h5 id="pT"></h5>
            <p class="pq" id="pQ"></p>
          </div><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body pt-3" id="pB"></div>
        <div class="modal-footer border-0"><button class="btn-soft" data-bs-dismiss="modal">Continue walking</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const $ = s => document.querySelector(s);
    /* World size is set by applyLayout(): landscape ('l') or portrait ('p', phones) */
    let W = 1200, H = 790, VY0 = -34, VH = 830, mode = null;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const cv = $('#g'), ctx = cv.getContext('2d'), dpr = Math.min(devicePixelRatio || 1, 2);
    let cssW = 1200, cssH = 640, sc = 1, ox = 0, oy = 0;
    const cam = { y: 0 }; let manualT = 0;
    const rr = (x, y, w, h, r) => { r = Math.max(0, Math.min(r, w / 2, h / 2)); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath() };
    const fr = (x, y, w, h, r, c) => { ctx.fillStyle = c; rr(x, y, w, h, r); ctx.fill() };
    const circ = (x, y, r, c) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill() };
    const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);

    /* ---------- Places (static data; positions come from the layout) ---------- */
    const PL = [
      { id: 'home', name: 'Home', emo: '🏠', col: '#ffe3cf', roof: '#f4a77c', win: '#fff8e8', door: '#d98a5f', msg: 'Welcome Home! 🏠 This is where the story begins. Come on in!' },
      { id: 'about', name: 'About Me', emo: '🏛️', col: '#ebe4ff', roof: '#a995ee', win: '#fffbe6', door: '#8a77d8', msg: 'You’ve arrived at the About Hall! 🎉 Come in and meet the owner.' },
      { id: 'projects', name: 'Workstation', emo: '💻', col: '#d8f5ec', roof: '#58c6ac', win: '#e8fbff', door: '#3fae94', msg: 'Here we are at the Workstation! 💻 Let’s see what has been built.' },
      { id: 'qualification', name: 'School', emo: '🏫', col: '#fff3c4', roof: '#f0c25a', win: '#fffdf3', door: '#d9a63a', msg: 'Welcome to the School! 🎓 Let’s look at the studies and certificates.' },
      { id: 'history', name: 'Office', emo: '🏢', col: '#dcecff', roof: '#6fa3e8', win: '#f4faff', door: '#4f86d4', msg: 'This is the Office! 💼 Let’s see where the owner has worked.' },
      { id: 'contact', name: 'Post Office', emo: '📮', col: '#ffe1ea', roof: '#f28aa6', win: '#fff7fa', door: '#dd6f8d', msg: 'You made it to the Post Office! 📮 Leave a message for the owner.' },
      { id: 'training', name: 'Training', emo: '🎯', col: '#e6f5d0', roof: '#86c24f', win: '#fbfff0', door: '#68a53a', msg: 'Welcome to the Training Center! 🎯 Let’s see the courses and workshops.' }];
    PL.forEach(b => { b.bt = 0; b.open = 0; b.openT = 0 });

    const LAYOUT = {
      l: {
        W: 1200, H: 790, VY0: -34, VH: 830,
        pos: { home: [600, 320, 230, 130], about: [190, 30, 190, 120], projects: [1010, 30, 190, 120], qualification: [130, 330, 190, 120], history: [1070, 330, 190, 120], contact: [600, 30, 190, 120], training: [600, 590, 190, 120] },
        ex: { W: [440, 512], E: [760, 512], L1: [360, 420], L2: [360, 262], R1: [840, 420], R2: [840, 262], TW: [440, 754], TE: [760, 754] },
        edges: [['home', 'W'], ['home', 'E'], ['W', 'qualification'], ['E', 'history'], ['W', 'L1'], ['L1', 'L2'], ['L2', 'about'], ['L2', 'contact'], ['contact', 'R2'], ['E', 'R1'], ['R1', 'R2'], ['R2', 'projects'], ['W', 'TW'], ['E', 'TE'], ['TW', 'training'], ['TE', 'training']],
